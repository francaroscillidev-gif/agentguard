<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#050814" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="url(#bgGlow)" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
  </g>

  <!-- Left Side: Hero Shield Icon -->
  <g transform="translate(140, 110) scale(0.85)">
    <!-- Shield Neon Glow -->
    <path d="M 256 64 C 360 64 416 112 416 232 C 416 352 288 424 256 448 C 224 424 96 352 96 232 C 96 112 152 64 256 64 Z"
          fill="none" stroke="url(#shieldBorder)" stroke-width="20" opacity="0.4" filter="url(#neonGlow)" />

    <!-- Shield Body -->
    <path d="M 256 64 C 360 64 416 112 416 232 C 416 352 288 424 256 448 C 224 424 96 352 96 232 C 96 112 152 64 256 64 Z"
          fill="url(#shieldFill)" stroke="url(#shieldBorder)" stroke-width="10" stroke-linejoin="round" />

    <!-- Central Neural Diamond -->
    <polygon points="256,192 312,248 256,304 200,248" fill="#030712" stroke="url(#coreGlow)" stroke-width="6" />
    <polygon points="256,212 292,248 256,284 220,248" fill="url(#coreGlow)" opacity="0.9" />
    <circle cx="256" cy="248" r="8" fill="#ffffff" />
    <circle cx="256" cy="154" r="6" fill="#38bdf8" />
    <circle cx="256" cy="342" r="6" fill="#38bdf8" />
    <circle cx="178" cy="248" r="6" fill="#38bdf8" />
    <circle cx="334" cy="248" r="6" fill="#38bdf8" />
  </g>

  <!-- Right Side: Typography & Badges -->
  <g transform="translate(620, 200)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="115" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">ENTERPRISE AI SENTINEL</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">AgentGuard</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
      Execution Shield &amp; Supply Chain Sentinel
    </text>
    <text x="0" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
      for Autonomous Coding Agents
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="65" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">ANTI-HALLUCINATION</text>

      <rect x="142" y="0" width="120" height="32" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="202" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle">SHELL SHIELD</text>

      <rect x="274" y="0" width="110" height="32" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="329" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">SARIF 2.1.0</text>

      <rect x="396" y="0" width="110" height="32" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="451" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle">MCP SERVER</text>
    </g>
  </g>
</svg>

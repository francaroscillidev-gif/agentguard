<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#050814" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <!-- Core AI Glow Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00f2fe" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Cyber Security Grid Overlay -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="96" y1="0" x2="96" y2="512" />
    <line x1="176" y1="0" x2="176" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="336" y1="0" x2="336" y2="512" />
    <line x1="416" y1="0" x2="416" y2="512" />
    <line x1="0" y1="96" x2="512" y2="96" />
    <line x1="0" y1="176" x2="512" y2="176" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="336" x2="512" y2="336" />
    <line x1="0" y1="416" x2="512" y2="416" />
  </g>

  <!-- Ambient Shield Neon Blur Behind -->
  <path d="M 256 64 C 360 64 416 112 416 232 C 416 352 288 424 256 448 C 224 424 96 352 96 232 C 96 112 152 64 256 64 Z"
        fill="none" stroke="url(#shieldBorder)" stroke-width="16" opacity="0.35" filter="url(#neonGlow)" />

  <!-- Main Defensive Shield Body -->
  <path d="M 256 64 C 360 64 416 112 416 232 C 416 352 288 424 256 448 C 224 424 96 352 96 232 C 96 112 152 64 256 64 Z"
        fill="url(#shieldFill)" stroke="url(#shieldBorder)" stroke-width="8" stroke-linejoin="round" />

  <!-- Inner Cyber Contour Line -->
  <path d="M 256 88 C 342 88 392 128 392 232 C 392 334 282 398 256 418 C 230 398 120 334 120 232 C 120 128 170 88 256 88 Z"
        fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Central Agent Neural Sentinel Core (AI Eye / Diamond) -->
  <g transform="translate(0, 8)" filter="url(#softShadow)">
    <!-- Circuit Synapses -->
    <path d="M 256 160 L 256 200 M 256 296 L 256 336 M 184 248 L 214 248 M 298 248 L 328 248"
          stroke="url(#coreGlow)" stroke-width="4" stroke-linecap="round" />

    <!-- Upper Diagonal Tracks -->
    <line x1="208" y1="200" x2="228" y2="220" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
    <line x1="304" y1="200" x2="284" y2="220" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
    <!-- Lower Diagonal Tracks -->
    <line x1="208" y1="296" x2="228" y2="276" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
    <line x1="304" y1="296" x2="284" y2="276" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />

    <!-- External Rotating Diamond Guard -->
    <polygon points="256,192 312,248 256,304 200,248"
             fill="#030712" stroke="url(#coreGlow)" stroke-width="5" stroke-linejoin="round" />

    <!-- Inner AI Neural Core (Glowing Sapphire Prism) -->
    <polygon points="256,212 292,248 256,284 220,248"
             fill="url(#coreGlow)" opacity="0.9" filter="url(#neonGlow)" />

    <!-- Center Bright Singularity Dot -->
    <circle cx="256" cy="248" r="7" fill="#ffffff" />

    <!-- Node Connection Pins (Sentinel Sensors) -->
    <circle cx="256" cy="154" r="5" fill="#38bdf8" />
    <circle cx="256" cy="342" r="5" fill="#38bdf8" />
    <circle cx="178" cy="248" r="5" fill="#38bdf8" />
    <circle cx="334" cy="248" r="5" fill="#38bdf8" />
    <circle cx="204" cy="196" r="4" fill="#a855f7" />
    <circle cx="308" cy="196" r="4" fill="#a855f7" />
    <circle cx="204" cy="300" r="4" fill="#a855f7" />
    <circle cx="308" cy="300" r="4" fill="#a855f7" />
  </g>

  <!-- Verified Safe Checkmark Accent at Bottom Anchor -->
  <g transform="translate(0, 10)">
    <circle cx="256" cy="396" r="16" fill="#042f2e" stroke="url(#emeraldAccent)" stroke-width="3" />
    <polyline points="250,396 254,400 263,391" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
